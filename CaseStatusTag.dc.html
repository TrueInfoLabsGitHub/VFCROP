<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex; align-items:center; padding:3px 9px; border-radius:9999px; background:{{ bg }}; color:#fff; font-family:Inter,system-ui,sans-serif; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; line-height:1.4; white-space:nowrap;">{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:36},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;In Review&quot;,&quot;options&quot;:[&quot;New&quot;,&quot;In Review&quot;,&quot;Authenticated&quot;,&quot;Enforcement&quot;,&quot;Closed&quot;],&quot;tsType&quot;:&quot;'New'|'In Review'|'Authenticated'|'Enforcement'|'Closed'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status || 'New';
    const map = {
      'New':           { bg: '#1F4E96', label: 'New' },
      'In Review':     { bg: '#8C6A00', label: 'In Review' },
      'Authenticated': { bg: '#2E7D32', label: 'Authenticated' },
      'Enforcement':   { bg: '#C0392B', label: 'Enforcement' },
      'Closed':        { bg: '#5A6B82', label: 'Closed' }
    };
    const m = map[s] || map['New'];
    return { bg: m.bg, label: m.label };
  }
}
</script>
</body>
</html>
