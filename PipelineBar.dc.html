<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes vfPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(31,78,150,.40); } 50% { box-shadow: 0 0 0 4px rgba(31,78,150,0); } }
@media (prefers-reduced-motion: reduce) { .vf-pulse-seg { animation: none !important; } }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:6px; width:100%;">
  <div style="display:flex; gap:3px; align-items:center; width:100%;">
    <sc-for list="{{ segs }}" as="seg" hint-placeholder-count="6">
      <div class="{{ seg.cls }}" style="flex:1 1 0; height:{{ segH }}px; border-radius:9999px; background:{{ seg.bg }}; border:{{ seg.border }}; box-sizing:border-box; animation:{{ seg.anim }};"></div>
    </sc-for>
  </div>
  <sc-if value="{{ showLabel }}" hint-placeholder-val="{{ false }}">
    <span style="font-family:Inter,system-ui,sans-serif; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#5A6B82;">Stage {{ stageNum }} of 6 · {{ currentName }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:48},&quot;stage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const STAGES = ['Intake', 'Analysis', 'Review', 'Verdict', 'Enforcement', 'Closed'];
    const stage = Math.max(0, Math.min(5, this.props.stage == null ? 0 : this.props.stage));
    const compact = !!this.props.compact;
    const segs = STAGES.map((name, i) => {
      if (i < stage) return { bg: '#1F4E96', border: '1px solid #1F4E96', anim: 'none', cls: '' };
      if (i === stage) return { bg: '#EDF1F7', border: '1.5px solid #1F4E96', anim: 'vfPulse 1.9s ease-in-out infinite', cls: 'vf-pulse-seg' };
      return { bg: '#E2E8F1', border: '1px solid #E2E8F1', anim: 'none', cls: '' };
    });
    return { segs, showLabel: !compact, currentName: STAGES[stage], stageNum: stage + 1, segH: compact ? 5 : 6 };
  }
}
</script>
</body>
</html>
