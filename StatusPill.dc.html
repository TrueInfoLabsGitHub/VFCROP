<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:9999px; background:{{ bg }}; color:{{ fg }}; font-family:Inter,system-ui,sans-serif; font-size:12px; font-weight:600; line-height:1.3; white-space:nowrap;">
  <sc-if value="{{ isAuthentic }}" hint-placeholder-val="{{ true }}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ fg }}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </sc-if>
  <sc-if value="{{ isCaution }}" hint-placeholder-val="{{ false }}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ fg }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
  </sc-if>
  <sc-if value="{{ isCounterfeit }}" hint-placeholder-val="{{ false }}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ fg }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
  </sc-if>
  <sc-if value="{{ isNeutral }}" hint-placeholder-val="{{ false }}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ fg }}" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </sc-if>
  <span>{{ label }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;counterfeit&quot;,&quot;options&quot;:[&quot;authentic&quot;,&quot;caution&quot;,&quot;counterfeit&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;'authentic'|'caution'|'counterfeit'|'neutral'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'neutral';
    const map = {
      authentic:   { bg: '#E8F3E9', fg: '#2E7D32', label: 'Authentic' },
      caution:     { bg: '#FBF3DC', fg: '#8A6A00', label: 'Inconclusive' },
      counterfeit: { bg: '#FBE9E7', fg: '#C0392B', label: 'No Match' },
      neutral:     { bg: '#EEF2F7', fg: '#5A6B82', label: 'Not Assessed' }
    };
    const m = map[v] || map.neutral;
    return {
      bg: m.bg, fg: m.fg,
      label: this.props.label != null && this.props.label !== '' ? this.props.label : m.label,
      isAuthentic: v === 'authentic',
      isCaution: v === 'caution',
      isCounterfeit: v === 'counterfeit',
      isNeutral: v === 'neutral'
    };
  }
}
</script>
</body>
</html>
